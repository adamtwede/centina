Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50

# Connect logs every request with its host, allowed or denied; `net.mjs
# hosts` reads them to cut the allowlist to what a pilot run needed.
LogLevel Connect

# Deny by default; only domains matching a line of the allowlist pass.
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterType ere
FilterCaseSensitive No

# HTTPS tunnels only to 443.
ConnectPort 443

DisableViaHeader Yes
